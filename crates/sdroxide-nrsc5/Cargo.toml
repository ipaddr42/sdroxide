[package]
name = "sdroxide-nrsc5"
version.workspace = true
edition.workspace = true
# HD Radio (NRSC-5) through the `libnrsc5` installed on the machine, found with
# dlopen at run time (issue #488): nothing of nrsc5 is compiled in, and so
# neither is the patched faad2 its HDC audio needs, which the library carries
# privately. A machine without it builds and runs the same, and offers the mode
# greyed out with the reason. nrsc5 itself is GPL-3.0-or-later.
license.workspace = true

# Native-only: dlopens a C library. Must never be a dependency of any
# wasm-targeted crate.

[dependencies]
libloading.workspace = true
sdroxide-types.workspace = true
sdroxide-dsp.workspace = true
num-complex.workspace = true
rtrb.workspace = true
tracing.workspace = true

[dev-dependencies]
# For the capture example only: it drives the decoder, and the warnings that
# path emits are part of what it reports.
tracing-subscriber.workspace = true
